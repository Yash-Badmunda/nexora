services:
  mongo:
    image: mongo:6
    container_name: nexora-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./backend
    container_name: nexora-backend
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8001:8001"
    env_file:
      - ./backend/.env

  frontend:
    build: ./frontend
    container_name: nexora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - ./frontend/.env

volumes:
  mongo_data:
