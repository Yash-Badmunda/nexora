version: "3.9"

services:
  mongo:
    image: mongo:6
    container_name: nexora-mongo
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db



  frontend:
    build: ./frontend
    container_name: nexora-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      REACT_APP_BACKEND_URL: http://localhost:8001
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_WHATSAPP_NUMBER: "919466058904"
      NEXT_PUBLIC_GA_ID: ""
      WDS_SOCKET_PORT: "3000"

volumes:
  mongo_data:
